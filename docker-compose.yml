services:
  db:
    image: postgres:16
    container_name: cards-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: text_cards
      S3_ENDPOINT: http://host.docker.internal:9000
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: cards-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: cards-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      mc mb myminio/my-bucket --ignore-existing &&
      mc anonymous set download myminio/my-bucket &&
      exit 0
      "
    restart: "no"


  backend:
    build: .
    container_name: cards-backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/text_cards
      - SECRET_KEY=your-super-secret-key-change-in-production
      - S3_BUCKET=my-bucket
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      - WEATHER_API_KEY=38053d514bc1805eeb57d04ffb5792d2
      - WEATHER_API_URL=http://api.openweathermap.org/data/2.5/weather
    command: >
      bash -c "alembic upgrade head && python -m app.main"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  ollama:
    image: ollama/ollama
    container_name: cards-ai
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama


volumes:
  postgres_data:
  ollama_data:
  minio_data:
